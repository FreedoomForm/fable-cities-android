name: Android build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Build APK + unit tests
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web bundle into APK assets (web-parity track)
        run: |
          npm ci --no-audit --no-fund
          npx vite build
          # Downscale the CC0 texture sets for the phone: 4K source images never
          # show beyond ~1024 px in the WebView; keeps the APK at a sane size.
          # Formats and filenames are untouched, so GLTF texture references keep working.
          pip install --quiet pillow
          python3 tools/downscale_assets.py dist/assets 1024
          mkdir -p android/app/src/main/assets/web
          cp -r dist/. android/app/src/main/assets/web/
          du -sh android/app/src/main/assets/web
          ls android/app/src/main/assets/web | head

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK (native + bundled web-parity assets)
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: android
        run: gradle :app:test --stacktrace

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: fable-cities-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Boot APK on emulator (crash + render + screenshot gate)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 45

    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "::warning::/dev/kvm missing — emulator will run without acceleration (slow)"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: fable-cities-${{ github.sha }}
          path: artifact

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run emulator boot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -memory 3072
          disable-animations: true
          script: |
            # NOTE 1: android-emulator-runner runs this script LINE BY LINE (one sh -c per line) -
            # no multi-line if/for. NOTE 2: variable expansion inside the script is unreliable
            # (GITHUB_WORKSPACE renders masked, $() captures came back empty across 4 runs) - so
            # this script uses ZERO shell variables: the artifact is a single file uploaded with
            # path android/app/build/outputs/apk/debug/app-debug.apk, which lands at
            # artifact/app-debug.apk after v4 strips the android/app/build root.
            ls -la artifact || true
            adb install -r artifact/app-debug.apk
            # ---- GATE 1: web-parity launcher (WebView + three.js, slow first boot on swiftshader) ----
            adb logcat -c
            adb shell am start -W -n com.fablecities.android/.ParityActivity
            sleep 90
            adb logcat -d > parity_bootcat.txt || true
            adb shell pidof com.fablecities.android > pid_parity.txt || true
            grep -q "[0-9]" pid_parity.txt || { echo "::error::Parity (WebView) process died during launch"; grep -E "Fatal signal|FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime|chromium|Console|fablecities" parity_bootcat.txt | head -60; exit 1; }
            grep -E "\[ERROR:CONSOLE" parity_bootcat.txt | grep -v -i favicon && { echo "::error::Web-parity page reported console errors inside the WebView (shader compile / 404 / JS exception)"; grep -E "\[ERROR:CONSOLE" parity_bootcat.txt | head -20; exit 1; } || true
            adb exec-out screencap -p > parity_screen.png
            # ---- GATE 2: native GLES renderer activity ----
            adb shell am force-stop com.fablecities.android
            sleep 2
            adb logcat -c
            adb shell am start -W -n com.fablecities.android/.MainActivity
            sleep 20
            # dump the FULL logcat BEFORE the pid check - the last-500 window lost the crash lines
            adb logcat -d > full_bootcat.txt || true
            adb shell pidof com.fablecities.android > pid.txt || true
            grep -q "[0-9]" pid.txt || { echo "::error::Native APK process died during launch (the gate that used to be missing)"; grep -E "Fatal signal|FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime|fablecities|GlCityRenderer" full_bootcat.txt | head -50; exit 1; }
            grep -E "FATAL EXCEPTION|AndroidRuntime|Fatal signal" full_bootcat.txt && { echo "::error::Fatal in logcat during boot"; grep -E -A 25 "FATAL EXCEPTION|Fatal signal" full_bootcat.txt | head -80; exit 1; } || true
            # RENDER GATE: gfxinfo counts only HWUI frames (always 0 for a raw GLSurfaceView app),
            # so gate on the renderer's own error log instead - any shader compile/link failure or
            # GL runtime error means the frame can not be trusted. The screenshot artifact carries
            # the visual proof alongside the release.
            grep -E "GlCityRenderer: (shader|link|GL error)" full_bootcat.txt && { echo "::error::GL renderer reported compile/link/runtime errors"; grep -E "GlCityRenderer: " full_bootcat.txt | head -30; exit 1; } || true
            adb exec-out screencap -p > emulator_screen.png
            cp full_bootcat.txt full_logcat.txt
            echo "Emulator gate PASSED: parity + native both alive, no fatal, no page/GL errors"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ github.sha }}
          path: |
            parity_screen.png
            parity_bootcat.txt
            pid_parity.txt
            emulator_screen.png
            full_bootcat.txt
            full_logcat.txt
            pid.txt
            frames.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish commit-linked prerelease (only after boot gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="android-build-${short_sha}"
          APK=artifact/app-debug.apk
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            "$APK" \
            --target "$GITHUB_SHA" \
            --title "Android build ${short_sha}" \
            --notes "Fable Cities for Android, commit ${GITHUB_SHA}. Contains BOTH tracks: the web-parity launcher (the full production web game bundled and served offline in-app) and the native GLES renderer build. CI gates passed: build + unit tests, emulator boot for both activities (process alive, no fatal exceptions, no page console errors, no GL errors), screenshots in the emulator-${GITHUB_SHA} artifact." \
            --prerelease

  web-check:
    name: Browser verification loop (check + screenshots)
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npx vite build

      - name: Start dev server
        run: |
          nohup npx vite --host 127.0.0.1 --port 5180 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5180/ > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5180/ > /dev/null || (cat /tmp/vite.log && exit 1)

      - name: Smoke check (modules, console errors, perf)
        shell: bash
        run: |
          set -o pipefail
          node tools/check.mjs --url "http://127.0.0.1:5180/?quality=low&map=1024" --frames 12 --ready-timeout 600000 --soft-crash 2>&1 | tee /tmp/check.json
          grep -q environmentalCrash /tmp/check.json && echo "::warning::Headless GPU crashed (SwiftShader limitation) — module-level gate unavailable on this runner; see docs/ANDROID_PORT.md" || true

      - name: Capture screenshots (day / dusk / night, three cameras)
        shell: bash
        run: |
          set +e
          mkdir -p shots
          CHROME_OK=0
          node tools/shot.mjs --out shots/hero.png --preset city --time 10 --timeout 600000 --frames 6 && CHROME_OK=1
          node tools/shot.mjs --out shots/street.png --preset street --time 17.5 --timeout 600000 --frames 6
          node tools/shot.mjs --out shots/night.png --preset city --time 21.5 --timeout 600000 --frames 6
          node tools/shot.mjs --out shots/aerial.png --preset aerial --time 12 --timeout 600000 --frames 6
          ls -la shots/ || true
          if [ "$CHROME_OK" = "0" ] && [ ! -f shots/hero.png ]; then
            echo "::warning::No screenshots could be captured — headless GPU crash (SwiftShader). Visual gate must run on a GPU-capable machine."
          fi
          exit 0

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-check-${{ github.sha }}
          path: |
            /tmp/check.json
            shots/**
          if-no-files-found: warn
          retention-days: 30
