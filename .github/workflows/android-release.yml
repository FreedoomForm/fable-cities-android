name: Android build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, test, and publish APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: android
        run: gradle :app:test --stacktrace

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: fable-cities-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish commit-linked prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="android-build-${short_sha}"
          gh release create "$tag" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Android build ${short_sha}" \
            --notes "Automated native Android APK for commit ${GITHUB_SHA}. Build and unit tests passed in GitHub Actions." \
            --prerelease

  web-check:
    name: Browser verification loop (check + screenshots)
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npx vite build

      - name: Start dev server
        run: |
          nohup npx vite --host 127.0.0.1 --port 5180 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5180/ > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5180/ > /dev/null || (cat /tmp/vite.log && exit 1)

      - name: Smoke check (modules, console errors, perf)
        shell: bash
        run: |
          set -o pipefail
          node tools/check.mjs --url "http://127.0.0.1:5180/?quality=low" --frames 120 --ready-timeout 600000 --soft-crash 2>&1 | tee /tmp/check.json
          grep -q environmentalCrash /tmp/check.json && echo "::warning::Headless GPU crashed (SwiftShader limitation) — module-level gate unavailable on this runner; see docs/ANDROID_PORT.md" || true

      - name: Capture screenshots (day / dusk / night, three cameras)
        shell: bash
        run: |
          set +e
          mkdir -p shots
          CHROME_OK=0
          node tools/shot.mjs --out shots/hero.png --preset city --time 10 --timeout 600000 && CHROME_OK=1
          node tools/shot.mjs --out shots/street.png --preset street --time 17.5 --timeout 600000
          node tools/shot.mjs --out shots/night.png --preset city --time 21.5 --timeout 600000
          node tools/shot.mjs --out shots/aerial.png --preset aerial --time 12 --timeout 600000
          ls -la shots/ || true
          if [ "$CHROME_OK" = "0" ] && [ ! -f shots/hero.png ]; then
            echo "::warning::No screenshots could be captured — headless GPU crash (SwiftShader). Visual gate must run on a GPU-capable machine."
          fi
          exit 0

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-check-${{ github.sha }}
          path: |
            /tmp/check.json
            shots/**
          if-no-files-found: warn
          retention-days: 30
