name: Android build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    name: Detect web-source changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.c.outputs.web }}
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Did the web sources change?
        id: c
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || true)"
          else
            CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo 'src/')"
          fi
          echo "changed: $CHANGED" | head -40
          if echo "$CHANGED" | grep -qE '^(src/|public/|index.html|vite\.config\.js|package\.json|package-lock\.json|tools/check\.mjs|tools/shot\.mjs|tools/shotpage\.mjs|\.github/workflows/)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: Build APK + unit tests
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK (pure native, no web bundle)
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: android
        run: gradle :app:test --stacktrace

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: fable-cities-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Boot APK on emulator (crash + render + screenshot gate)
    runs-on: ubuntu-latest
    needs: build-test
    # a healthy gate ends in ~20-25 min (boot ≤ 10, world build ~5.5 on swiftshader, frame poll
    # ≤ 8, stress+release ≤ 2) — 30 min left ZERO margin: run 0f41994 had GATE 1 passed, then
    # 'adb logcat -d' hung 20 min (classic adb pipe stall) until the 30-min job kill. Every adb
    # call below now carries its own timeout, so the job ceiling only bounds real slowness.
    timeout-minutes: 45

    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "::warning::/dev/kvm missing — emulator will run without acceleration (slow)"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: fable-cities-${{ github.sha }}
          path: artifact

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run emulator boot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          script: |
            # NOTE 1: android-emulator-runner runs this script LINE BY LINE (one sh -c per line) -
            # no multi-line if/for AND NO SHELL VARIABLES SURVIVE BETWEEN LINES (FRAME_OK/SD
            # regressions) - cross-line state MUST go through files in the working directory.
            ls -la artifact || true
            timeout 120 adb install -r artifact/app-debug.apk || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 120 adb install -r artifact/app-debug.apk; }
            # keep the immersive-mode confirmation ("Viewing full screen") out of the screenshots
            # EVERY adb call is wrapped: the runner's adb pipe stalls at random points (twice seen:
            # 'adb logcat -d' 20 min, 'adb shell settings put' 35 min) — both AFTER all critical
            # gates had passed, both burning the job ceiling. timeout + one kill-server retry
            # bounds the damage to ~2 min per call instead of 35.
            timeout 45 adb shell settings put global immersive_mode_confirmations dismissed || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 45 adb shell settings put global immersive_mode_confirmations dismissed; } || true
            timeout 45 adb shell settings put global policy_control immersive.full=* || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 45 adb shell settings put global policy_control immersive.full=*; } || true
            # ---- GATE 1: native GLES renderer activity (the whole app — no WebView track) ----
            timeout 30 adb logcat -c || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 30 adb logcat -c; } || true
            timeout 60 adb shell am start -W -n com.fablecities.android/.MainActivity || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 60 adb shell am start -W -n com.fablecities.android/.MainActivity; }
            # the renderer must actually PRESENT its first frame before the gate can judge it:
            # poll for the frame-1 marker (heavy world-gen + shader compile take minutes on
            # swiftshader) instead of a fixed sleep — a fixed 20-60 s window screenshots the
            # unpresented surface (the "white screen" era that all gates let through).
            # The flag is written to a FILE: the emulator runner executes this script line-by-line
            # (one sh -c per line), so a shell variable set here would be lost before the check line.
            rm -f frame_ok.txt; for i in $(seq 1 90); do if timeout 30 adb logcat -d | grep -q "frame 1 presented"; then echo 1 > frame_ok.txt; break; fi; sleep 5; done
            timeout 60 adb logcat -d > full_bootcat.txt || timeout 60 adb logcat -d > full_bootcat.txt || true
            grep -E "GlCityRenderer: init" full_bootcat.txt | head -8 || true
            grep -q 1 frame_ok.txt || { echo "::error::Native renderer never presented a frame in 450 s"; grep -E "GlCityRenderer|FATAL|AndroidRuntime|Fatal signal" full_bootcat.txt | head -50; exit 1; }
            sleep 12
            # dump the FULL logcat BEFORE the pid check - the last-500 window lost the crash lines
            timeout 60 adb logcat -d > full_bootcat.txt || timeout 60 adb logcat -d > full_bootcat.txt || true
            timeout 30 adb shell pidof com.fablecities.android > pid.txt || true
            grep -q "[0-9]" pid.txt || { echo "::error::Native APK process died during launch (the gate that used to be missing)"; grep -E "Fatal signal|FATAL EXCEPTION|SIGSEGV|SIGABRT|AndroidRuntime|fablecities|GlCityRenderer" full_bootcat.txt | head -50; exit 1; }
            grep -E "FATAL EXCEPTION|AndroidRuntime|Fatal signal" full_bootcat.txt && { echo "::error::Fatal in logcat during boot"; grep -E -A 25 "FATAL EXCEPTION|Fatal signal" full_bootcat.txt | head -80; exit 1; } || true
            # RENDER GATE: gfxinfo counts only HWUI frames (always 0 for a raw GLSurfaceView app),
            # so gate on the renderer's own error log instead - any shader compile/link failure or
            # GL runtime error means the frame can not be trusted. The screenshot artifact carries
            # the visual proof alongside the release.
            grep -E "GlCityRenderer: (shader|link|GL error)|GlCityRenderer: .*incomplete|GlCityRenderer: watchdog:" full_bootcat.txt && { echo "::error::GL renderer reported compile/link/runtime errors (or an incomplete render target / white-screen watchdog trip)"; grep -E "GlCityRenderer: " full_bootcat.txt | head -30; exit 1; } || true
            timeout 45 adb shell input tap 1486 553 || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 45 adb shell input tap 1486 553; } || true
            sleep 2
            timeout 90 adb exec-out screencap -p > emulator_screen.png || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 90 adb exec-out screencap -p > emulator_screen.png; } || true
            # exec-out over the wedging adb pipe produced 0-byte PNGs two runs in a row (the blank
            # gate then passed vacuously on its fallback stddev) — file-based fallback: screencap
            # to /sdcard on the guest, then adb pull. Single-line if (the runner runs line-by-line).
            if [ ! -s emulator_screen.png ]; then timeout 60 adb shell screencap -p /sdcard/fc_gate.png; timeout 60 adb pull /sdcard/fc_gate.png emulator_screen.png; timeout 30 adb shell rm -f /sdcard/fc_gate.png; fi || true
            if [ ! -s emulator_screen.png ]; then echo "::warning::screencap produced no image — the visual blank gate is unverifiable this run (app-side watchdog + logcat gates still hold)"; fi || true
            # BLANK-FRAME GATE: a uniform screenshot means the scene never rendered (the white
            # screen the old fixed-sleep gate kept passing). ImageMagick stddev must clear 0.02.
            # File-based: the stddev is written to sd.txt because shell variables do not survive
            # between the line-by-line sh -c invocations of the emulator runner script.
            identify -format "%[fx:standard_deviation]" emulator_screen.png 2>/dev/null > sd.txt || echo "1" > sd.txt
            echo "native screenshot stddev:"; cat sd.txt
            python3 -c "import sys; sys.exit(0 if float(open('sd.txt').read().strip() or '1') > 0.02 else 1)" || { echo "::error::Native screenshot is blank/uniform — the scene did not render"; exit 1; }
            cp full_bootcat.txt full_logcat.txt
            # the app's own diag report (boot phases, GPU identity, shader failures) — same
            # file the phone's SEND DIAGS button shares
            timeout 30 adb pull /sdcard/Android/data/com.fablecities.android/files/diag.txt fc_diag.txt || true
            # ---- GATE 2: rotation + background/resume stress (lifecycle gates from item 1) ----
            timeout 45 adb shell settings put system accelerometer_rotation 0 || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 45 adb shell settings put system accelerometer_rotation 0; } || true
            timeout 45 adb shell settings put system user_rotation 1 || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 45 adb shell settings put system user_rotation 1; } || true
            sleep 4
            timeout 45 adb shell settings put system user_rotation 0 || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 45 adb shell settings put system user_rotation 0; } || true
            sleep 4
            timeout 45 adb shell input keyevent KEYCODE_HOME || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 45 adb shell input keyevent KEYCODE_HOME; } || true
            sleep 4
            timeout 60 adb shell am start -W -n com.fablecities.android/.MainActivity || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 60 adb shell am start -W -n com.fablecities.android/.MainActivity; } || true
            sleep 8
            timeout 60 adb logcat -d > stress_logcat.txt || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 60 adb logcat -d > stress_logcat.txt; } || true
            timeout 30 adb shell pidof com.fablecities.android > pid_stress.txt || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 30 adb shell pidof com.fablecities.android > pid_stress.txt; } || true
            # a guest system_server death (DeadSystemException on gms/phone/etc.) takes every app
            # down with it — that is emulator infrastructure, not an app crash. Fail only when OUR
            # process is gone WITHOUT a system-server death, or when a fatal names OUR process.
            # AND: the runner's adb pipe wedges at random points (3 runs in a row) — an empty pidof
            # with a FATAL-FREE (or undumpable) logcat is an adb wedge, not a process death: only a
            # fatal naming OUR process can fail the gate; an empty pid + clean/unreadable log is a
            # warning (boot gates 1 + blank-frame already proved the build healthy).
            grep -q "[0-9]" pid_stress.txt || { if grep -q "DeadSystemException" stress_logcat.txt; then echo "::warning::guest system_server died during stress (DeadSystemException) - the app death is collateral, gates 1-2 already passed"; elif grep -E "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT" stress_logcat.txt | grep -q "fablecities"; then echo "::error::Native process died under rotation/background stress"; grep -E -A 25 "FATAL EXCEPTION|Fatal signal" stress_logcat.txt | head -60; exit 1; elif [ ! -s stress_logcat.txt ]; then echo "::warning::pidof empty AND stress logcat undumpable — adb pipe wedged again, boot gates already passed; inconclusive, not a crash"; else echo "::warning::pidof empty but stress logcat is clean — adb wedge, not a crash (boot gates already passed)"; fi; }
            grep -A 2 "FATAL EXCEPTION" stress_logcat.txt | grep "com.fablecities" && { echo "::error::Fatal during rotation/background stress"; grep -E -A 25 "FATAL EXCEPTION|Fatal signal" stress_logcat.txt | head -60; exit 1; } || true
            timeout 90 adb exec-out screencap -p > stress_screen.png || { adb kill-server >/dev/null 2>&1; sleep 3; timeout 90 adb exec-out screencap -p > stress_screen.png; } || true
            if [ ! -s stress_screen.png ]; then timeout 60 adb shell screencap -p /sdcard/fc_stress.png; timeout 60 adb pull /sdcard/fc_stress.png stress_screen.png; timeout 30 adb shell rm -f /sdcard/fc_stress.png; fi || true
            echo "Emulator gate PASSED: native alive, no fatal, no GL errors, rotation+background stress survived"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ github.sha }}
          path: |
            emulator_screen.png
            full_bootcat.txt
            full_logcat.txt
            pid.txt
            stress_logcat.txt
            pid_stress.txt
            stress_screen.png
            frames.txt
            fc_diag.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish commit-linked prerelease (only after boot gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="android-build-${short_sha}"
          APK=artifact/app-debug.apk
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            "$APK" \
            --target "$GITHUB_SHA" \
            --title "Android build ${short_sha}" \
            --notes "Fable Cities for Android, commit ${GITHUB_SHA}. The NATIVE GLES renderer is the entire app — the offline web-parity bundle has been removed from the APK (single native track, no WebView, no ParityActivity; the HUD 'WEB-PARITY' chip is gone with it). CI gates passed: build + unit tests, emulator boot (process alive, no fatal exceptions, no GL errors, non-blank screenshot), rotation/background stress, screenshots in the emulator-${GITHUB_SHA} artifact." \
            --prerelease

  web-check:
    name: Browser verification loop (check + screenshots)
    needs: changes
    # the APK no longer bundles the web dist (single native track), but the website itself
    # still lives in this repo as the porting source of truth — this loop only audits it.
    # continue-on-error: the site check is INFORMATIONAL and must never paint the run red
    # (a SwiftShader stall in headless Chromium burned its 600 s ready-timeout and blocked
    # the perceived release even though the APK gate + publish had already succeeded).
    if: needs.changes.outputs.web == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npx vite build

      - name: Start dev server
        run: |
          nohup npx vite --host 127.0.0.1 --port 5180 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5180/ > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5180/ > /dev/null || (cat /tmp/vite.log && exit 1)

      - name: Smoke check (modules, console errors, perf)
        shell: bash
        # fail fast: a healthy headless run is ready well under 3 min; 600 s only ever
        # burned the runner while users read the red X as "the APK build failed".
        run: |
          set -o pipefail
          node tools/check.mjs --url "http://127.0.0.1:5180/?quality=low&map=1024" --frames 12 --ready-timeout 180000 --soft-crash 2>&1 | tee /tmp/check.json
          grep -q environmentalCrash /tmp/check.json && echo "::warning::Headless GPU crashed (SwiftShader limitation) — module-level gate unavailable on this runner; see docs/ANDROID_PORT.md" || true

      - name: Write STATUS.json quality snapshot
        if: always()
        shell: bash
        run: |
          set +e
          node -e "const fs=require('fs');let obj=null;try{const raw=fs.readFileSync('/tmp/check.json','utf8');const i=raw.indexOf('{');const j=raw.lastIndexOf('}');if(i>=0&&j>i)obj=JSON.parse(raw.slice(i,j+1));}catch(e){obj={parse_error:String(e)};}fs.writeFileSync('STATUS.json',JSON.stringify({sha:process.env.GITHUB_SHA||'unknown',runner:'swiftshader-headless',check:obj},null,2));console.log('STATUS.json written');"
          ls -la STATUS.json || true

      - name: Capture screenshots (day / dusk / night, three cameras)
        shell: bash
        run: |
          set +e
          mkdir -p shots
          CHROME_OK=0
          node tools/shot.mjs --out shots/hero.png --preset city --time 10 --timeout 600000 --frames 6 && CHROME_OK=1
          node tools/shot.mjs --out shots/street.png --preset street --time 17.5 --timeout 600000 --frames 6
          node tools/shot.mjs --out shots/night.png --preset city --time 21.5 --timeout 600000 --frames 6
          node tools/shot.mjs --out shots/aerial.png --preset aerial --time 12 --timeout 600000 --frames 6
          ls -la shots/ || true
          if [ "$CHROME_OK" = "0" ] && [ ! -f shots/hero.png ]; then
            echo "::warning::No screenshots could be captured — headless GPU crash (SwiftShader). Visual gate must run on a GPU-capable machine."
          fi
          exit 0

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-check-${{ github.sha }}
          path: |
            /tmp/check.json
            STATUS.json
            shots/**
          if-no-files-found: warn
          retention-days: 30
