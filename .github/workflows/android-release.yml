name: Android build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, test, and publish APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: android
        run: gradle :app:test --stacktrace

      - name: Upload APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: fable-cities-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish commit-linked prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="android-build-${short_sha}"
          gh release create "$tag" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Android build ${short_sha}" \
            --notes "Automated native Android APK for commit ${GITHUB_SHA}. Build and unit tests passed in GitHub Actions." \
            --prerelease
